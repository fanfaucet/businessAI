[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annaban-benchmark"
version = "0.1.0"
description = "Multi-model evaluation framework for consensus, routing, and governance scoring"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "fastapi>=0.111", "pydantic>=2.8", "openai>=1.40", "anthropic>=0.34"]

[project.scripts]
annaban = "annaban_benchmark.cli:main"


[tool.setuptools]
packages = ["annaban_benchmark"]
